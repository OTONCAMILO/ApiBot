# ===========================================
# ApiBotMessage - Configuração (APENAS PLACEHOLDERS)
# Valores reais DEVEM vir de variáveis de ambiente / secrets
# ===========================================

server.port=8080
spring.application.name=ApiBotMessage

# Jackson - desserialização robusta
spring.jackson.deserialization.fail-on-unknown-properties=false
spring.jackson.mapper.accept-case-insensitive-enums=true

# Meta WhatsApp Cloud API
whatsapp.api.version=v21.0
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:change_me_in_prod}
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}

# URL base da Graph API (não mudar)
whatsapp.graph-api.base-url=https://graph.facebook.com

# Async pool para processamento de webhook (não bloqueia a thread do Tomcat)
spring.task.execution.pool.core-size=4
spring.task.execution.pool.max-size=16
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=whatsapp-webhook-

# Timeout HTTP client (ms)
whatsapp.http.connect-timeout=5000
whatsapp.http.read-timeout=10000

# Logging focado
logging.level.com.apibotmessage=DEBUG
logging.level.org.springframework.web.client=DEBUG